[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-algorithms-network-optimization"
version = "0.1.0"
description = "Classical graph algorithms, network optimization methods, and reproducible reference implementations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jors Academy"}]
keywords = [
  "graph-algorithms",
  "network-optimization",
  "combinatorial-optimization",
  "operations-research",
  "shortest-path",
  "maximum-flow",
  "matching",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = []

[project.optional-dependencies]
reference = ["networkx>=3.2"]
community = ["igraph>=0.11", "leidenalg>=0.10"]
numerical = ["numpy>=1.26"]
dev = ["pytest>=8.0", "networkx>=3.2", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
